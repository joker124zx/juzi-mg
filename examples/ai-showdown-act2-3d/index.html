const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const mix = (a, b, t) => a + (b - a) * t;
const lerp = mix;

// Newton-Raphson + bisection cubic-bezier solver from video-shotcraft Polish.tsx
function bezier(x1, y1, x2, y2) {
  if (x1 === y1 && x2 === y2) return t => clamp01(t);
  const ax = 1 - 3 * x2 + 3 * x1, bx = 3 * x2 - 6 * x1, cx = 3 * x1;
  const ay = 1 - 3 * y2 + 3 * y1, by = 3 * y2 - 6 * y1, cy = 3 * y1;
  const sx = u => ((ax * u + bx) * u + cx) * u;
  const sy = u => ((ay * u + by) * u + cy) * u;
  const dx = u => (3 * ax * u + 2 * bx) * u + cx;
  const solve = x => {
    let u = x;
    for (let i = 0; i < 8; i++) {
      const err = sx(u) - x;
      if (Math.abs(err) < 1e-7) return u;
      const d = dx(u);
      if (Math.abs(d) < 1e-6) break;
      u -= err / d;
    }
    let lo = 0, hi = 1; u = x;
    for (let i = 0; i < 30; i++) {
      const v = sx(u);
      if (Math.abs(v - x) < 1e-7) break;
      if (v < x) lo = u; else hi = u;
      u = (lo + hi) / 2;
    }
    return u;
  };
  return t => (t <= 0 ? 0 : t >= 1 ? 1 : sy(solve(t)));
}

// Named easing presets from video-shotcraft Polish.tsx & Basic3DScene.tsx
const EASE = {
  snappy:    bezier(0.16, 1, 0.3, 1),
  out:       bezier(0.22, 1, 0.36, 1),

  fly:       bezier(0.62, 0, 0.16, 1), // Basic3DScene FLY_EASE
  flipCubic: bezier(0.215, 0.61, 0.355, 1), // IntegrationHubMap fast-flip slow-settle
  exit:      bezier(0.7, 0, 0.84, 0),
  anticip:   bezier(0.5, -0.32, 0.25, 1),
  overshoot: bezier(0.34, 1.45, 0.64, 1),
  linear:    t => clamp01(t),
};

// Time ramp in seconds
const ramp = (t, start, dur, ease = EASE.snappy) =>

// Closed-form spring & slap from mg-hook & video-shotcraft Look.tsx
const wob = (dt, f = 4.8, k = 10.5) => dt < 0 ? 0 : Math.exp(-k * dt) * Math.cos(2 * Math.PI * f * dt);
function spring(dt, f = 2.6, z = 0.38) {
  if (dt <= 0) return 0;
  const w = 2 * Math.PI * f, a = z * w, b = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-a * dt) * (Math.cos(b * dt) + (a / b) * Math.sin(b * dt));
}
function springV(dt, f = 2.6, z = 0.38) {
  if (dt <= 0) return 0;
  const w = 2 * Math.PI * f, a = z * w, b = w * Math.sqrt(1 - z * z);
  return Math.exp(-a * dt) * (w * w / b) * Math.sin(b * dt);
}
function popSS(t, t0, f = 2.7, z = 0.36, amt = 0.14) {
  const dt = t - t0;
  if (dt <= 0) return { s: 0, sx: 0, sy: 0, o: 0 };
  const s = spring(dt, f, z);
  const k = clamp(springV(dt, f, z) / (2 * Math.PI * f) * amt * 2, -0.26, 0.26);
  return { s, sx: s * (1 - k * 0.65), sy: s * (1 + k), o: clamp(dt * 14) };
}
function slap(t, land, dur = 0.18, amp = 0.34, tilt = 5) {
  const p = (t - (land - dur)) / dur;
  if (p < 0) return { o: 0, s: 1 + amp, sx: 1 + amp, sy: 1 + amp, r: tilt, lift: 1 };
  if (p < 1) {
    const L = 1 - p * p;
    return { o: clamp(p * 5), s: 1 + amp * L, sx: 1 + amp * L, sy: 1 + amp * L, r: tilt * L, lift: L };
  }
  const w = wob(t - land, 4.6, 10);
  return { o: 1, s: 1 - 0.04 * w, sx: 1 + 0.045 * w, sy: 1 - 0.055 * w, r: -0.9 * w, lift: 0 };
}
const hash = n => {

};

}

function updateScene1(t) {
  if (t >= 5.50) { scene1.style.display = 'none'; return; }
  scene1.style.display = 'block';

  // Keycap press at t = 1.80s..1.92s ("放弃了同质化内卷" -> KeycapSmashCut.tsx)
  const pressU = ramp(t, 1.80, 0.12, EASE.snappy);
  const fadeKey = 1 - ramp(t, 2.15, 0.25, EASE.out);
  const breathY = t < 1.80 ? -5 * Math.sin(t * 6.5) : 0;
  const pressY = 14 * pressU;
  const thick = mix(14, 3, pressU);
  s1Keycap.style.opacity = fadeKey;
  s1Keycap.style.transform = `translateY(${(breathY + pressY).toFixed(1)}px)`;
  s1Keycap.style.boxShadow = `0 ${thick.toFixed(1)}px 0 #1E293B, 0 ${(thick * 2 + 10).toFixed(1)}px 28px rgba(15,23,42,0.25)`;

  // Shockwave ring (1.88s -> 2.55s)
  if (t >= 1.88 && t < 2.60) {
    const rGrow = ramp(t, 1.88, 0.55, EASE.out);
    const rFade = 1 - ramp(t, 1.88, 0.68, EASE.linear);
    const d = mix(90, 760, rGrow);
    s1Ring.style.width = `${d.toFixed(1)}px`;
    s1Ring.style.height = `${d.toFixed(1)}px`;
    s1Ring.style.borderWidth = `${mix(14, 2, rGrow).toFixed(1)}px`;
    s1Ring.style.opacity = (0.85 * rFade).toFixed(3);
  } else {
    s1Ring.style.opacity = 0;
  }

  // Camera zoom pull-back (1.22 -> 0.96) + 180° Y-axis fast flip (t=1.92s..3.02s)
  const camU = ramp(t, 1.65, 1.55, EASE.fly);
  const zoom = mix(1.22, 0.96, camU);
  const flipU = ramp(t, 1.92, 1.10, EASE.flipCubic);
  const rotY = 180 * flipU;
  const tiltX = Math.sin(flipU * Math.PI) * 8;
  s1FlipRig.style.transform = `scale(${zoom.toFixed(4)}) rotateX(${tiltX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;

  // Edge bloom peaks when rotY passes 90° (around t = 2.20s)
  const edgeDist = Math.abs(rotY - 90);
  s1EdgeBloom.style.opacity = edgeDist < 28 ? ((1 - edgeDist / 28) * 0.85).toFixed(3) : 0;

  // Background parallax deco rects
  const mapIn = ramp(t, 2.55, 0.55, EASE.out);
  S1_DECO_RECTS.forEach(r => { r.style.opacity = (mapIn * 0.45).toFixed(3); });

  // Two-beat tile pop (t=2.85s) + optical pipe connection (t=3.18s) + continuous comet flow
  S1_PIPES.forEach((p, i) => {
    const tPop = popSS(t, 2.85 + i * 0.14, 2.8, 0.36, 0.14);
    p.tile.style.opacity = tPop.o;
    p.tile.style.transform = `scale(${tPop.sx.toFixed(3)}, ${tPop.sy.toFixed(3)})`;

    const grow = ramp(t, 3.18 + i * 0.14, 0.34, EASE.out);
    const dashOn = p.len * grow;
    p.basePath.setAttribute('stroke-dasharray', `${dashOn.toFixed(1)} ${p.len + 50}`);
    p.corePath.setAttribute('stroke-dasharray', `${dashOn.toFixed(1)} ${p.len + 50}`);

    if (grow > 0 && grow < 1) {
      p.spark.setAttribute('opacity', '1');
      const nums = p.path.match(/-?[\d.]+/g).map(Number);
      p.spark.setAttribute('cx', mix(nums[0], nums[2], grow).toFixed(1));
      p.spark.setAttribute('cy', mix(nums[1], nums[3], grow).toFixed(1));
    } else {
      p.spark.setAttribute('opacity', '0');
    }

    if (grow >= 1) {
      const flowIn = ramp(t, 3.55, 0.25, EASE.out);
      const offset = -((t - 3.20) * 140 + i * 25);
      p.cometPath.setAttribute('opacity', (0.92 * flowIn).toFixed(3));
      p.cometPath.setAttribute('stroke-dashoffset', offset.toFixed(1));
    } else {
      p.cometPath.setAttribute('opacity', '0');
    }
  });
}

function camAt2(t) {
  const pullIn = 280 * (1 - ramp(t, 5.45, 0.55, EASE.out));
  const uFly = ramp(t, 7.45, 0.82, EASE.swift);
  const rawFly = clamp01((t - 7.45) / 0.82);
  // Terminal3D.tsx signature mid-flight pull-back hop: sin(pi * u^0.85) * 1100px
  const hopPull = Math.sin(Math.PI * Math.pow(rawFly, 0.85)) * 1100;
  const pull = pullIn + hopPull - 30 * ramp(t, 9.30, 0.70, EASE.smooth);

  const a = S2_POSES[0], b = S2_POSES[1];
  const pose = {
    x: mix(a.x, b.x, uFly),
    y: mix(a.y, b.y, uFly),
    z: mix(a.z, b.z, uFly),
    ry: mix(a.ry, b.ry, uFly)
  };
  const view = mix(S2_VIEW[0], S2_VIEW[1], uFly);
  return { s: uFly, pull, pose, yaw: view - pose.ry };
}

function project2(cam, p) {
  const x0 = p[0] - cam.pose.x, y0 = p[1] - cam.pose.y, z0 = p[2] - cam.pose.z;
  const ty = (cam.yaw * Math.PI) / 180, tx = (S2_TILT * Math.PI) / 180;
  const x1 = x0 * Math.cos(ty) + z0 * Math.sin(ty);
  const z1 = -x0 * Math.sin(ty) + z0 * Math.cos(ty);
  const y2 = y0 * Math.cos(tx) - z1 * Math.sin(tx);
  const z2 = y0 * Math.sin(tx) + z1 * Math.cos(tx) - cam.pull;
  return { x: x1, y: y2, z: z2 };
}
function toScreen2(q) {
  const k = PERSP2 / Math.max(120, PERSP2 - q.z);
  return { x: 960 + q.x * k, y: 540 + q.y * k, k };
}

function updateScene2(t) {
  if (t < 5.45 || t >= 10.30) {
    scene2.style.display = 'none';
    scene2.style.filter = 'none';
    return;
  }
  scene2.style.display = 'block';

  const cam = camAt2(t);
  // Inverse camera transform (Terminal3D.tsx / Basic3DScene.tsx)
  s2World.style.transform =
    `translateZ(${(-cam.pull).toFixed(1)}px) rotateX(${S2_TILT}deg) rotateY(${cam.yaw.toFixed(2)}deg) translate3d(${(-cam.pose.x).toFixed(1)}px, ${(-cam.pose.y).toFixed(1)}px, ${(-cam.pose.z).toFixed(1)}px)`;

  // SpeedBlur during flight (7.45s - 8.25s)
  if (t > 7.47 && t < 8.24) {
    const flightV = Math.sin(clamp01((t - 7.47) / 0.77) * Math.PI);
    speedBlurG.setAttribute('stdDeviation', `${(flightV * 14).toFixed(1)} 0`);
    scene2.style.filter = 'url(#speedBlur)';
  } else {
    scene2.style.filter = 'none';
  }

  // Isomorphic 3D-projected SVG floor grid (Terminal3D.tsx Floor)
  let floorHtml = '';
  const CELL = 320;
  for (let i = -8; i <= 8; i++) {
    const pa = project2(cam, [i * CELL, FLOOR_Y2, -2200]);
    const pb = project2(cam, [i * CELL, FLOOR_Y2, 1600]);
    if (pa.z < PERSP2 - 150 && pb.z < PERSP2 - 150) {
      const sa = toScreen2(pa), sb = toScreen2(pb);
      floorHtml += `<line x1="${sa.x.toFixed(1)}" y1="${sa.y.toFixed(1)}" x2="${sb.x.toFixed(1)}" y2="${sb.y.toFixed(1)}"/>`;
    }
  }
  for (let j = -7; j <= 5; j++) {
    const pa = project2(cam, [-2600, FLOOR_Y2, j * CELL]);
    const pb = project2(cam, [2600, FLOOR_Y2, j * CELL]);
    if (pa.z < PERSP2 - 150 && pb.z < PERSP2 - 150) {
      const sa = toScreen2(pa), sb = toScreen2(pb);
      floorHtml += `<line x1="${sa.x.toFixed(1)}" y1="${sa.y.toFixed(1)}" x2="${sb.x.toFixed(1)}" y2="${sb.y.toFixed(1)}"/>`;
    }
  }
  s2FloorG.innerHTML = floorHtml;

  // Position & DOF Focus for the 2 3D Windows
  [s2Win0, s2Win1].forEach((win, i) => {
    const p = S2_POSES[i];
    const dist = Math.abs(cam.s - i);
    const focus = clamp(1 - dist * 0.85, 0.25, 1);
    win.style.transform = `translate3d(${p.x}px, ${p.y}px, ${p.z}px) rotateY(${p.ry}deg)`;
    win.style.opacity = (0.28 + 0.72 * focus).toFixed(3);
    win.style.filter = focus < 0.96 ? `blur(${((1 - focus) * 5).toFixed(1)}px)` : 'none';
    if (dist < 0.15) {

    } else {

  });

  s2RmbRoll.textContent = `约合 ¥${rmb.toLocaleString()} / 年`;

  // Station 2 Ready Pulse (9.20s)
  const readyPop = popSS(t, 9.20, 2.8, 0.36, 0.15);
  s2ReadyBadge.style.transform = `scale(${(readyPop.s || 1).toFixed(3)})`;
}

function camAt3(t) {
  const orbit = ramp(t, 10.65, 2.80, EASE.smooth);
  const tall = ramp(t, 10.45, 0.90, EASE.smooth) * (1 - ramp(t, 13.55, 0.68, EASE.smooth));
  return {
    rx: mix(52, 46, orbit),
    rz: mix(-30, -18, orbit),
    s: mix(0.65, 0.55, tall),
    cx: mix(0, 20, orbit),
    cy: mix(10, 108, tall)
  };
}
function project3(c, px, py, pz) {
  const X = px - W3 / 2, Y = py - H3 / 2;
  const a = (c.rz * Math.PI) / 180, b = (c.rx * Math.PI) / 180;
  const x1 = X * Math.cos(a) - Y * Math.sin(a);
  const y1 = X * Math.sin(a) + Y * Math.cos(a);
  const y2 = y1 * Math.cos(b) - pz * Math.sin(b);
  const z2 = y1 * Math.sin(b) + pz * Math.cos(b);
  const x4 = x1 * c.s + c.cx, y4 = y2 * c.s + c.cy;
  const k = PERSP3 / Math.max(200, PERSP3 - z2);
  return { x: 960 + x4 * k, y: 486 + y4 * k };
}

function updateScene3(t) {
  if (t < 10.25 || t >= 14.72) { scene3.style.display = 'none'; return; }
  scene3.style.display = 'block';

  const cam = camAt3(t);
  // Reverse slam assembly at t = 13.58s..14.18s, thud at 14.16s
  const sinceClose = t - 14.16;
  const thud = sinceClose >= 0 ? 10 * Math.exp(-sinceClose * 9) * Math.cos(sinceClose * 26) : 0;

  s3BoardRig.style.transform =
    `translate(${cam.cx.toFixed(1)}px, ${(cam.cy + thud).toFixed(1)}px) scale(${cam.s.toFixed(4)}) rotateX(${cam.rx.toFixed(2)}deg) rotateZ(${cam.rz.toFixed(2)}deg)`;

  // Sheen sweep across assembled board (14.16s -> 14.60s)
  const sheenP = ramp(t, 14.16, 0.44, EASE.swift);
  if (sheenP > 0 && sheenP < 1) {
    const pos = -20 + 140 * sheenP;
    s3Sheen.style.opacity = '1';
    s3Sheen.style.background = `linear-gradient(108deg, transparent ${pos - 18}%, rgba(255,255,255,0.75) ${pos}%, transparent ${pos + 18}%)`;
  } else {
    s3Sheen.style.opacity = '0';
  }

  S3_LAYERS.forEach((ly, i) => {
    const up = spring(t - (10.50 + i * 0.11), 2.3, 0.42);
    const down = ramp(t, 13.55 + (4 - i) * 0.08, 0.36, EASE.exit);
    const p = Math.max(0, up * (1 - down));
    const z = ly.z * p + 2;

    ly.body.style.transform = `translateZ(${z.toFixed(1)}px)`;
    if (p > 0.03) {
      ly.edge.style.opacity = '1';
      ly.edge.style.transform = `translateZ(${Math.max(1, z - 8).toFixed(1)}px)`;
      ly.sh.style.opacity = (Math.min(1, p * 1.4) * (0.75 - z / 1200)).toFixed(3);
      ly.sh.style.transform = `translate3d(${(z * 0.16).toFixed(1)}px, ${(z * 0.24).toFixed(1)}px, 1px)`;
      ly.sh.style.filter = `blur(${(10 + z * 0.08).toFixed(1)}px)`;
    } else {
      ly.edge.style.opacity = '0';
      ly.sh.style.opacity = '0';
    }

    // 3D-Projected Callouts (visible during hover 10.95s - 13.55s)
    const callIn = ramp(t, 10.95 + i * 0.12, 0.30, EASE.out) * (1 - ramp(t, 13.40, 0.22, EASE.exit));
    const cItem = S3_CALLOUTS[i];
    if (callIn > 0.02) {
      const anchorX = ly.side === 'L' ? ly.x : ly.x + ly.w;
      const anchorY = ly.y + ly.h / 2;
      const pt = project3(cam, anchorX, anchorY, z);
      const colX = ly.side === 'L' ? 420 : 1500;
      const targetY = ly.side === 'L' ? (i === 0 ? 310 : 620) : (i === 4 ? 210 : i === 3 ? 440 : 690);
      const elbowX = ly.side === 'L' ? colX + 45 : colX - 45;

      cItem.poly.setAttribute('points', `${pt.x.toFixed(1)},${pt.y.toFixed(1)} ${elbowX.toFixed(1)},${targetY.toFixed(1)} ${colX.toFixed(1)},${targetY.toFixed(1)}`);
      cItem.poly.setAttribute('opacity', callIn.toFixed(3));
      cItem.dot.setAttribute('cx', pt.x.toFixed(1));
      cItem.dot.setAttribute('cy', pt.y.toFixed(1));
      cItem.dot.setAttribute('opacity', callIn.toFixed(3));

      const tagX = ly.side === 'L' ? colX - 350 : colX + 12;
      cItem.tag.style.opacity = callIn.toFixed(3);
      cItem.tag.style.transform = `translate(${tagX.toFixed(1)}px, ${(targetY - 46 + (1 - callIn) * 14).toFixed(1)}px)`;
    } else {
      cItem.poly.setAttribute('opacity', '0');
      cItem.dot.setAttribute('opacity', '0');
      cItem.tag.style.opacity = '0';
    }
  });
}

    scene: '数 G 原生视频拉片 + 2M 百万代码库吞吐',
    metrics: ['2,000,000 Tokens 零截断', '原生逐帧理解 4K 视频与长音频', 'Google Workspace 深度联动'],

  },
  {
    id: 'claude', name: 'Claude 4.6 Opus', maker: 'ANTHROPIC · 代码与文字工匠',
    col: '#D97757', dark: '#B45309', bg: '#FFF7ED', x: 960, y: 515,

    metrics: ['Claude Code 终端独立接管工程', '前端 UI / 架构审美断崖式第一', '文笔克制细腻、口播稿免大改'],
    verdict: '👉 写核心代码 / 深度长文必选'
  },

    col: '#10A37F', dark: '#047857', bg: '#ECFDF5', x: 1550, y: 515,
    scene: 'DeepResearch 全网调研 + 满血实时语音',
    metrics: ['全网自动交叉核验百篇信源', '超低延迟情绪化实时语音陪练', 'Python 沙盒画图与 Excel 分析'],
    verdict: '👉 跑全自动调研 / 日常管家必选'
  }
].map((m, i) => {
  const cw = 524, ch = 590;
  // Vacated slot on the board (SceneOpen.tsx lines 240-258)
  const slot = el('div', '', s4Stage,
    `position:absolute;left:${m.x - cw / 2}px;top:${m.y - ch / 2}px;width:${cw}px;height:${ch}px;border-radius:36px;background:rgba(15,23,42,0.05);border:3px dashed ${m.col}`
  );
  // Levitating 3D Card Container
  const wrap = el('div', '', s4Stage,
    `position:absolute;left:${m.x - cw / 2}px;top:${m.y - ch / 2}px;width:${cw}px;height:${ch}px;transform-style:preserve-3d`
  );
  wrap.setAttribute('data-box', `s4-card-${i}`);

  // 2.5D Keycap Bevel Base + Top Surface
  const cardInner = el('div', '', wrap,
    `position:absolute;inset:0;border-radius:36px;background:#FFFFFF;border:6px solid ${m.col};padding:28px 30px;display:flex;flex-direction:column;justify-content:space-between`
  );
  cardInner.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between">

      <div style="width:86px;height:86px;border-radius:22px;background:${m.bg};border:3px solid ${m.col};display:flex;align-items:center;justify-content:center">

      🎯 主场：${m.scene}
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:18px;background:#0F172A;color:#F8FAFC;font:700 20px/1.3 'Alibaba PuHuiTi'">
      ${m.metrics.map(item => `<div style="display:flex;align-items:center;gap:10px"><span style="color:${m.col};font-weight:900">✦</span><span>${item}</span></div>`).join('')}

  // SceneOpen.tsx Perimeter Laser Beam SVG around the card outline
  const beamSvg = sv('svg', {
    width: cw + 16, height: ch + 16,
    style: 'position:absolute;left:-8px;top:-8px;pointer-events:none;overflow:visible'
  }, wrap);

    fill: 'none', stroke: '#FF5A36', 'stroke-width': 7, 'stroke-linecap': 'round',
    pathLength: 1, 'stroke-dasharray': '0.28 0.72', 'stroke-dashoffset': 0, opacity: 0
  }, beamSvg);

  return { ...m, cw, ch, slot, wrap, cardInner, beamRect, verdictEl: cardInner.querySelector('.s4-verdict') };
});

function updateScene4(t) {
  if (t < 14.20) { scene4.style.display = 'none'; return; }
  scene4.style.display = 'block';

  // video-shotcraft R1 Hero Hold: after 16.15s, freeze card motion and do subtle 1.5% camera push
  const isHold = t >= 16.15;
  const enterU = ramp(t, 14.20, 0.75, EASE.fly);
  const holdCreep = ramp(t, 16.15, 1.85, EASE.smooth);
  const rotX = mix(18, 0, enterU);
  const rotY = mix(-12, 0, enterU);
  const scale = mix(0.88, 1.0, enterU) * (1 + 0.015 * holdCreep);

  s4Stage.style.transform = `scale(${scale.toFixed(4)}) rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;

  const tAnim = Math.min(t, 16.15);
  S4_MODELS.forEach((m, i) => {
    const rise = ramp(tAnim, 14.30 + i * 0.14, 0.45, EASE.overshoot);
    const settle = ramp(tAnim, 15.65 + i * 0.08, 0.40, EASE.out);
    const lift = rise * (1 - 0.55 * settle);
    const z = 75 * lift;

    m.wrap.style.transform = `translateZ(${z.toFixed(1)}px)`;
    m.cardInner.style.boxShadow = `0 ${(12 + 24 * lift).toFixed(1)}px ${(28 + 40 * lift).toFixed(1)}px rgba(15,23,42,${(0.16 + 0.14 * lift).toFixed(3)})`;

    // Perimeter laser beam sweeps around card i during its spotlight window
    const bStart = 14.45 + i * 0.42;
    const bProg = clamp01((t - bStart) / 0.55);
    if (bProg > 0 && bProg < 1 && !isHold) {
      m.beamRect.setAttribute('opacity', '1');
      m.beamRect.setAttribute('stroke-dashoffset', (-bProg).toFixed(3));
    } else {
      m.beamRect.setAttribute('opacity', '0');
    }

    const vPop = popSS(tAnim, 14.55 + i * 0.35, 2.8, 0.36, 0.14);
    m.verdictEl.style.opacity = vPop.o;
    m.verdictEl.style.transform = `scale(${(vPop.sx || 1).toFixed(3)}, ${(vPop.sy || 1).toFixed(3)})`;
  });
}

// ============================================================================
// 8. MASTER FRAME CONTROLLER: window.setVideoTime(t) & window.renderAt(t)
// ============================================================================
const FLASH_CUT_TIMES = [4.40, 9.60, 14.20];

window.setVideoTime = function(tRaw) {
  const t = clamp(Number(tRaw) || 0, 0, 18.0);

  // 1. Update active scene
  updateScene1(t);
  updateScene2(t);
  updateScene3(t);
  updateScene4(t);

  // 2. Warm FlashCut straddling scene transitions (video-shotcraft FlashCut.tsx)
  let flashAlpha = 0;
  FLASH_CUT_TIMES.forEach(cutT => {
    const dt = Math.abs(t - cutT);
    if (dt < 0.14) flashAlpha = Math.max(flashAlpha, (1 - dt / 0.14) * 0.55);
  });
  flashCut.style.opacity = flashAlpha.toFixed(3);

  // 3. Top Header & Telemetry Recipe Readout
  if (t < 4.40) {
    topPhaseTxt.textContent = t < 1.25
      ? '01 过去：死磕同一张跑分卷 · 同质化内卷'
      : '01 3D 翻面进化中枢 · 三大巨头分道扬镳';
    teleRecipe.textContent = 'RECIPE: KEYCAP_SMASH + HUB_FLIP_3D';
  } else if (t < 9.60) {
    topPhaseTxt.textContent = t < 7.10
      ? '02 3D 空间终端巡航 · 盲目全订浪费预算'
      : '02 3D 空间终端巡航 · 错误工具绕路 vs 光纤直达';
    teleRecipe.textContent = 'RECIPE: TERMINAL_3D + INVERSE_CAM';
  } else if (t < 14.20) {
    topPhaseTxt.textContent = '03 3/4 轴测五层 3D 爆炸分解图 · 真实生产力沙盘';
    teleRecipe.textContent = 'RECIPE: EXPLODED_VIEW_3D + CALLOUTS';
  } else {
    topPhaseTxt.textContent = t >= 16.15
      ? '04 三大顶流终极选型指南 · SHOTCRAFT R1 定格'
      : '04 3D 悬浮卡片激光扫描 · 真实场景对号入座';
    teleRecipe.textContent = 'RECIPE: PAGECAM_LEVITATE + R1_HOLD';
  }

  // 4. Bottom Subtitle & Spark-Fuse
  const cap = CAPTIONS.find(c => t >= c[0] && t < c[1]) || CAPTIONS[CAPTIONS.length - 1];
  if (subTxt.innerHTML !== cap[2]) subTxt.innerHTML = cap[2];
  subTime.textContent = `${t.toFixed(1).padStart(4, '0')}s / 18.0s`;
  fuseFill.style.width = `${((t / 18.0) * 100).toFixed(2)}%`;
};

window.DEMO = { width: 1920, height: 1080, fps: 30, duration: 18.0 };
window.renderAt = async function(t) { window.setVideoTime(t); };
window.__ready = true;
window.setVideoTime(0);
</script>
