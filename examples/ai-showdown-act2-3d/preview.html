<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Act II · 3D Voxel + Blender 5.2 + 2D MG 集百家之长预览器 (18.0s)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #0B0F15; color: #E2E8F0;
    font: 13px/1.4 "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; background: #111822; border-bottom: 1px solid #1E293B;
  }
  .top-title { font-weight: 800; font-size: 14px; color: #F8FAFC; display: flex; align-items: center; gap: 10px; }
  .badge { background: #FF5500; color: #fff; padding: 3px 9px; border-radius: 4px; font-size: 11px; font-weight: 900; }
  .chapters { display: flex; gap: 8px; flex-wrap: wrap; }
  .ch-btn {
    background: #1E293B; color: #CBD5E1; border: 1px solid #334155; border-radius: 6px;
    padding: 5px 11px; cursor: pointer; font: 700 12px inherit; transition: 0.15s;
  }
  .ch-btn:hover, .ch-btn.active { background: #FF5500; color: #fff; border-color: #FF5500; }
  .nav-link {
    background: #0F172A; color: #38BDF8; border: 1px solid #0284C7; border-radius: 6px;
    padding: 5px 11px; text-decoration: none; font: 800 12px inherit;
  }
  #stage { flex: 1; position: relative; overflow: hidden; background: #070A0E; }
  #f { position: absolute; border: 0; transform-origin: 0 0; background: #0d121f; box-shadow: 0 20px 60px rgba(0,0,0,0.65); }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; color: #94A3B8; font-size: 15px; pointer-events: none; }
  .ctl {
    display: flex; gap: 10px; align-items: center; padding: 12px 18px;
    background: #111822; border-top: 1px solid #1E293B;
  }
  .ctl button, .ctl select {
    background: #1E293B; color: #F1F5F9; border: 1px solid #334155; border-radius: 6px;
    padding: 6px 12px; font: 700 12px inherit; cursor: pointer;
  }
  .ctl button:hover { background: #334155; }
  .ctl button.primary { background: #FF5500; border-color: #FF5500; color: #fff; min-width: 78px; }
  .ctl input[type=range] {
    flex: 1; accent-color: #FF5500; height: 6px; cursor: pointer;
  }
  #lbl {
    font: 700 12px "JetBrains Mono", "Consolas", monospace;
    min-width: 180px; text-align: right; color: #94A3B8;
  }
</style>
</head>
<body>
<div class="top-bar">
  <div class="top-title">
    <span class="badge">3D VOXEL + BLENDER 5.2</span>
    <span>Act II · 三大巨头告别同质化内卷（Minecraft 体素 + Blender 5.2 + Manim/3B1B + Shotcraft R1）</span>
  </div>
  <div class="chapters">
    <button class="ch-btn" data-t="0.0">B1a · 黑石塔震动 (0.0s)</button>
    <button class="ch-btn" data-t="2.0">B1b · 崩裂三岛与Blender核 (2.0s)</button>
    <button class="ch-btn" data-t="5.5">B2a · 岩浆漏斗烧钱 (5.5s)</button>
    <button class="ch-btn" data-t="7.6">B2b · 红石迷宫vs黄金桥 (7.6s)</button>
    <button class="ch-btn" data-t="10.3">B3a · 抛弃纸面跑分盖章 (10.3s)</button>
    <button class="ch-btn" data-t="12.3">B3b · 3B1B滑动窗口矩阵 (12.3s)</button>
    <button class="ch-btn" data-t="14.7">B4 · 黄金罗盘俯冲+R1定格 (14.7s)</button>
    <a class="nav-link" href="/mg-hook/preview.html">⬅ 查看 Act I (0-17s)</a>
  </div>
</div>

<div id="stage">
  <iframe id="f" src="./index.html"></iframe>
  <div id="msg">正在加载 3D Minecraft Voxel 世界 + Blender 5.2 PBR 资产 + MGAudio 音轨…</div>
</div>

<div class="ctl">
  <button id="play" class="primary">▶ 播放</button>
  <button id="prevF" title="上一帧 (←)">-1帧</button>
  <button id="nextF" title="下一帧 (→)">+1帧</button>
  <input id="t" type="range" min="0" max="18" step="0.001" value="0">
  <select id="spd">
    <option value="0.5">0.5x 慢放</option>
    <option value="1" selected>1.0x 原速</option>
    <option value="1.5">1.5x 倍速</option>
  </select>
  <span id="lbl">0.000 s / 18.000 s · f0</span>
</div>

<audio id="snd" src="./out/audio.wav" preload="auto"></audio>

<script>
const $ = id => document.getElementById(id);
const f = $('f'), t = $('t'), lbl = $('lbl'), btn = $('play'), snd = $('snd'), spd = $('spd');
let D = { width: 1920, height: 1080, fps: 30, duration: 18.0 };
let busy = false, want = null, playing = false, lastTs = 0, curT = 0;

function fit() {
  const s = $('stage'), k = Math.min((s.clientWidth - 24) / D.width, (s.clientHeight - 24) / D.height);
  f.style.width = D.width + 'px';
  f.style.height = D.height + 'px';
  f.style.transform = `translate(${(s.clientWidth - D.width * k) / 2}px, ${(s.clientHeight - D.height * k) / 2}px) scale(${k})`;
}

async function seek(x, syncAudio = false) {
  curT = Math.max(0, Math.min(D.duration, x));
  t.value = curT;
  if (syncAudio && snd.readyState >= 1) {
    try { snd.currentTime = curT; } catch (e) {}
  }

  document.querySelectorAll('.ch-btn').forEach((b, idx, arr) => {
    const bt = +b.dataset.t;
    const nt = idx + 1 < arr.length ? +arr[idx + 1].dataset.t : D.duration + 1;
    b.classList.toggle('active', curT >= bt && curT < nt);
  });

  want = curT;
  if (busy) return;
  busy = true;
  while (want != null) {
    const s = want; want = null;
    const w = f.contentWindow;
    if (w && w.setVideoTime) {
      try { w.setVideoTime(s); } catch (e) { console.error(e); }
    }
    lbl.textContent = `${s.toFixed(3)} s / ${D.duration.toFixed(1)} s · f${Math.round(s * D.fps)}`;
  }
  busy = false;
}

function loop(now) {
  if (!playing) return;
  const dt = (now - lastTs) / 1000 * (+spd.value);
  lastTs = now;
  let nextT = (!snd.paused && snd.readyState >= 2) ? snd.currentTime : curT + dt;
  if (nextT >= D.duration) {
    nextT = 0;
    if (!snd.paused) snd.currentTime = 0;
  }
  seek(nextT, false);
  requestAnimationFrame(loop);
}

function togglePlay() {
  playing = !playing;
  btn.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  if (playing) {
    lastTs = performance.now();
    snd.playbackRate = +spd.value;
    snd.currentTime = curT;
    snd.play().catch(() => {});
    requestAnimationFrame(loop);
  } else {
    snd.pause();
  }
}

btn.onclick = togglePlay;
spd.onchange = () => { snd.playbackRate = +spd.value; };
t.oninput = () => {
  if (playing) togglePlay();
  seek(+t.value, true);
};
$('prevF').onclick = () => { if (playing) togglePlay(); seek(curT - 1 / D.fps, true); };
$('nextF').onclick = () => { if (playing) togglePlay(); seek(curT + 1 / D.fps, true); };

document.querySelectorAll('.ch-btn').forEach(b => {
  b.onclick = () => seek(+b.dataset.t, true);
});

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); if (playing) togglePlay(); seek(curT - 1 / D.fps, true); }
  if (e.code === 'ArrowRight') { e.preventDefault(); if (playing) togglePlay(); seek(curT + 1 / D.fps, true); }
});

f.onload = async () => {
  const w = f.contentWindow;
  while (!w || w.__ready !== true) await new Promise(r => setTimeout(r, 50));
  fit();
  $('msg').remove();
  seek(0, true);
};
window.addEventListener('resize', fit);
</script>
</body>
</html>
