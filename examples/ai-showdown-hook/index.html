// ==================== MATH & MG PHYSICS LIBRARY ====================
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const P = (t, a, d) => clamp((t - a) / d);
const oC = u => 1 - Math.pow(1 - u, 3);
const oQ = u => 1 - Math.pow(1 - u, 4);
const oX = u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u);
const iQ = u => u * u;
const ioC = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const ioS = u => -(Math.cos(Math.PI * u) - 1) / 2;
const oB = (u, s = 1.70158) => 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2);

function bez(x1, y1, x2, y2) {
  return u => {
    if (u <= 0) return 0;
    if (u >= 1) return 1;
    let t = u;
    for (let i = 0; i < 8; i++) {
      const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - u;
      const d = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t;
      if (Math.abs(d) < 1e-6) break;
      t = clamp(t - cx / d);
    }
    return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3;
  };
}
const eFly = bez(0.62, 0, 0.18, 1);
const ePop = bez(0.34, 1.56, 0.64, 1);

// Damped cosine wobble (impulse response)
const wob = (dt, f = 4.8, k = 10.5) => dt < 0 ? 0 : Math.exp(-k * dt) * Math.cos(2 * Math.PI * f * dt);

// Closed-form spring & velocity for Squash & Stretch (from 01-flat-vector)
function spring(t, f = 2.6, z = 0.38) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f, a = z * w, b = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-a * t) * (Math.cos(b * t) + (a / b) * Math.sin(b * t));
}
function springV(t, f = 2.6, z = 0.38) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f, a = z * w, b = w * Math.sqrt(1 - z * z);
  return Math.exp(-a * t) * (w * w / b) * Math.sin(b * t);
}
function popSS(t, t0, f = 2.6, z = 0.38, amt = 0.14) {
  const dt = t - t0;
  if (dt <= 0) return { s: 0, sx: 0, sy: 0, o: 0 };
  const s = spring(dt, f, z);
  const k = clamp(springV(dt, f, z) / (2 * Math.PI * f) * amt * 2, -0.28, 0.28);
  return { s, sx: s * (1 - k * 0.65), sy: s * (1 + k), o: clamp(dt * 12) };
}

// Sticker slap physics: hovers large & tilted with deep shadow -> slams down -> damped wobble
function slap(t, land, dur = 0.18, amp = 0.34, tilt = 7) {
  const p = (t - (land - dur)) / dur;
  if (p < 0) return { o: 0, s: 1 + amp, sx: 1 + amp, sy: 1 + amp, r: tilt, lift: 1 };
  if (p < 1) {
    const L = 1 - iQ(p);
    return { o: clamp(p * 5), s: 1 + amp * L, sx: 1 + amp * L, sy: 1 + amp * L, r: tilt * L, lift: L };

  const w = wob(t - land, 4.6, 10);
  return { o: 1, s: 1 - 0.04 * w, sx: 1 + 0.045 * w, sy: 1 - 0.055 * w, r: -0.9 * w, lift: 0 };
}

function cam(t) {
  if (t <= CAM[0].t) return { ...CAM[0] };

      const e = b.move === 'fly' ? eFly(u) : ioS(u);
      return {
        x: lerp(a.x, b.x, e),
        y: lerp(a.y, b.y, e),
        z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), e)),
        r: lerp(a.r || 0, b.r || 0, e)

    }

}

}

         <div style="transform:scale(0.68)">${LOGO_SVG[w.id]}</div>
       </div>
     </div>
     <div style="margin-top:26px">${dioHtml}</div>
     <div style="margin-top:28px;display:flex;flex-direction:column;gap:18px">
       ${w.bullets.map(b => `<div style="display:flex;align-items:center;gap:14px;font:800 28px/1.2 'Alibaba PuHuiTi';color:#25313D">
         <span style="width:16px;height:16px;border-radius:50%;background:${w.col};flex:none"></span>${b}
       </div>`).join('')}
     </div>`
  );

  // Rubber Stamp Seal on each Workflow Track (single-line nowrap!)
  const stamp = el('div', 'stk', screen,
    `height:74px;padding:0 28px;border-radius:18px;background:${w.col};border:8px solid #F7F9FB;box-shadow:0 14px 30px rgba(18,28,40,.28);color:#fff;font:900 30px/1 'Alibaba PuHuiTi';white-space:nowrap;display:flex;align-items:center;justify-content:center;z-index:38;opacity:0`,
    `★ ${w.badge}`
  );

  // Graphic Match #3 flying orb + dotted contrail from Zone C (1200, CY) to Zone D card header
  const sx = 1200 + (i - 1) * 260, sy = CY + 80;
  const tx = w.x, ty = w.y - 260;
  const cx = (sx + tx) / 2 + (i - 1) * 180, cy = (sy + ty) / 2;
  const trail = sv('path', {
    d: `M${sx} ${sy} Q${cx} ${cy} ${tx} ${ty}`,
    fill: 'none', stroke: w.col, 'stroke-width': 7, 'stroke-linecap': 'round',
    'stroke-dasharray': '4 18', opacity: 0
  }, trailSvg);
  const orb = sv('circle', { r: 28, fill: w.col, stroke: '#F7F9FB', 'stroke-width': 9, opacity: 0 }, trailSvg);

  return {
    ...w, tw, th, card, stamp, trail, orb,
    playhead: card.querySelector('.playhead'),
    wbars: [...card.querySelectorAll('.wbar')],
    tLand: EV.orbs_land[i], tTrack: EV.tracks_in[i], tBadge: EV.workflow_badges[i]
  };
});

// Bottom Hero Lockup Banner ("抛开枯燥跑分榜单 · 直接从真实生产力场景选工具")
const heroBanner = el('div', 'stk', screen,
  `left:200px;top:${DY + 310}px;width:2000px;height:210px;border-radius:42px;background:#1D2731;border:12px solid #F7F9FB;box-shadow:0 30px 80px rgba(10,16,24,.42);padding:34px 64px;display:flex;align-items:center;justify-content:space-between;color:#fff;z-index:36;opacity:0`,
  `<div>
     <div class="mono" style="font:800 22px/1 'Inter';color:#FF5A36;letter-spacing:.22em">THE GOLDEN RULE // 终极选购法则</div>
     <div style="font:900 62px/1.15 'Alibaba PuHuiTi';margin-top:12px;position:relative">
       抛开枯燥跑分榜单，从<span style="position:relative;display:inline-block;margin:0 8px"><i id="dMark" style="position:absolute;left:-6px;right:-6px;bottom:2px;height:28px;background:#FF5A36;border-radius:6px;transform-origin:0 50%;transform:scaleX(0)"></i><span style="position:relative">真实生产力工作流</span></span>出发！
     </div>
   </div>
   <div style="padding:20px 36px;border-radius:24px;background:#FF5A36;font:900 38px/1 'Alibaba PuHuiTi';color:#fff;box-shadow:0 12px 28px rgba(255,90,54,.4)">
     按钉子选锤子 →
   </div>`
);
const dMark = heroBanner.querySelector('#dMark');

U.push(t => {
  dHeader.style.opacity = oC(P(t, 13.0, 0.38));

  WORKFLOWS.forEach((w, i) => {
    // Graphic Match #3 orb flight along quadratic bezier
    const uOrb = eFly(P(t, EV.orbs_peel + i * 0.04, w.tLand - (EV.orbs_peel + i * 0.04)));
    if (t < EV.orbs_peel + i * 0.04 || t >= w.tLand + 0.15) {
      w.orb.setAttribute('opacity', '0');
      w.trail.setAttribute('opacity', t >= w.tLand && t < 15.2 ? (1 - P(t, w.tLand, 1.2)).toFixed(2) : '0');
    } else {
      const len = w.trail.getTotalLength();
      const pt = w.trail.getPointAtLength(len * uOrb);
      w.orb.setAttribute('cx', pt.x.toFixed(1));
      w.orb.setAttribute('cy', pt.y.toFixed(1));
      w.orb.setAttribute('opacity', '1');
      w.trail.setAttribute('opacity', '0.85');
    }

    // Track Card Slap & Idle Float
    const sl = slap(t, w.tTrack, 0.20, 0.32, (i - 1) * 4);
    const flY = Math.sin(t * 2.6 + i * 1.8) * 6;
    w.card.style.opacity = sl.o;
    w.card.style.transform = `translate(${(w.x - w.tw / 2).toFixed(1)}px, ${(w.y - w.th / 2 + flY).toFixed(1)}px) rotate(${sl.r.toFixed(2)}deg) scale(${sl.sx.toFixed(4)}, ${sl.sy.toFixed(4)})`;

    // Live inside-card micro-animations
    if (w.playhead) {
      const px = 28 + ((t * 140) % 500);
      w.playhead.style.left = `${px.toFixed(1)}px`;
    }
    if (w.wbars.length) {
      w.wbars.forEach((bar, bi) => {
        const h = 24 + Math.abs(Math.sin(t * 9.5 + bi * 0.75)) * 74;
        bar.style.height = `${h.toFixed(1)}px`;
      });
    }

    // Rubber Stamp Badge Slap
    const bSl = slap(t, w.tBadge, 0.16, 0.44, -8 + i * 4);
    w.stamp.style.opacity = bSl.o;
    w.stamp.style.transform = `translate(${(w.x - 40).toFixed(1)}px, ${(w.y + 305 + flY).toFixed(1)}px) rotate(${(-4 + i * 3 + bSl.r).toFixed(2)}deg) scale(${bSl.sx.toFixed(4)}, ${bSl.sy.toFixed(4)})`;
  });

  // Final Hero Lockup Banner
  const hb = slap(t, EV.hero_banner, 0.20, 0.28, -2);
  const hbBreath = Math.sin(t * 3.0) * 3;
  heroBanner.style.opacity = hb.o;
  heroBanner.style.transform = `translate(0px, ${hbBreath.toFixed(1)}px) rotate(${hb.r.toFixed(2)}deg) scale(${hb.sx.toFixed(4)}, ${hb.sy.toFixed(4)})`;
  dMark.style.transform = `scaleX(${ioC(P(t, EV.marker_d[0], EV.marker_d[1] - EV.marker_d[0])).toFixed(4)})`;
});


// ==================== BOTTOM CHAPTER RAIL HUD (from 19-paperclip) ====================
const hLogo = el('div', 'a', hud,
  `left:88px;top:1012px;font:900 24px/1 'Alibaba PuHuiTi';color:#25313D;letter-spacing:.06em`,
  `<span style="display:inline-block;width:15px;height:15px;background:#FF5A36;margin-right:12px;vertical-align:-1px;border-radius:3px"></span>AI 生产力实验室 <span class="mono" style="font-size:16px;letter-spacing:.22em;margin-left:12px;opacity:.65">MG ENGINE v2.0</span>`
);
const CHP = [
  ['01', '高频提问 (0.0s)'],
  ['02', '三巨头对决 (1.8s)'],
  ['03', '破除伪概念 (8.0s)'],
  ['04', '真实工作流 (12.9s)']
];
const CHT = cues.chapters;
const RX = 1060, RW = 770, SGW = (RW - 3 * 12) / 4;
const hCh = CHP.map((c, i) => {
  const e = el('div', 'a', hud,
    `left:${RX + i * (SGW + 12)}px;top:1006px;width:${SGW}px;font:800 18px/1 'Alibaba PuHuiTi';color:#25313D;white-space:nowrap`,
    `<span class="mono" style="font-weight:800;font-size:15px;color:#FF5A36;margin-right:8px">${c[0]}</span>${c[1]}`
  );
  const tr = el('div', 'a', hud,
    `left:${RX + i * (SGW + 12)}px;top:1036px;width:${SGW}px;height:5px;border-radius:3px;background:rgba(37,49,61,.16);overflow:hidden`
  );
  const f = el('div', 'a', tr, `left:0;top:0;width:${SGW}px;height:5px;background:#FF5A36;transform-origin:0 50%`);
  return { e, tr, f };
});

// ==================== CAMERA MOTION BLUR & MASTER RENDER LOOP ====================
const camEl = document.getElementById('cam');
const mbg = document.getElementById('mbg');
const dotsEl = document.getElementById('dots');

function camBlur(t) {
  const h = 1 / 60;
  const A = cam(Math.max(0, t - h)), B = cam(Math.min(cues.duration, t + h));
  const vx = Math.abs((A.x - B.x) * B.z) * 0.22;
  const vy = Math.abs((A.y - B.y) * B.z) * 0.22;
  if (vx + vy < 1.2) {
    camEl.style.filter = 'none';
  } else {
    mbg.setAttribute('stdDeviation', `${Math.min(5, vx).toFixed(2)} ${Math.min(14, vy).toFixed(2)}`);
    camEl.style.filter = 'url(#mbf)';
  }
}

window.renderAt = async (t0) => {
  const t = clamp(t0, 0, cues.duration);
  const C = cam(t), W = worldM(t, C);
  world.style.transform = `matrix(${W.m.map(v => v.toFixed(5)).join(',')})`;
  camBlur(t);

  // Subtle ambient drift on dot grid & geometric background shapes
  dotsEl.style.transform = `translate(${(Math.sin(t * 0.7) * 18).toFixed(1)}px, ${(Math.cos(t * 0.5) * 18).toFixed(1)}px)`;
  DECO_ITEMS.forEach(d => {
    const dy = Math.sin(t * 2.1 + d.phase) * 16;
    const dr = t * 28 * (d.kind === 'ring' ? 0.5 : 1) + d.phase * 40;
    d.g.setAttribute('transform', `translate(${d.x} ${(d.y + dy).toFixed(1)}) rotate(${dr.toFixed(1)}) scale(${d.s})`);
  });

  // Update all scene zones
  for (const fn of U) fn(t, C, W);

  // Update bottom chapter progress rail
  hCh.forEach((h, i) => {
    const on = t >= CHT[i] && t < CHT[i + 1];
    h.e.style.opacity = on ? '1' : '0.45';
    h.f.style.transform = `scaleX(${clamp((t - CHT[i]) / (CHT[i + 1] - CHT[i])).toFixed(4)})`;
  });
};

await document.fonts.ready;
await window.renderAt(0);
window.__ready = true;
</script>
